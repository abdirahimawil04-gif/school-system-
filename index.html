    const PAGE_SIZE = 20;

    function escapeHtml(str) {
        if (!str) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    function genId() { return Date.now() + Math.floor(Math.random() * 100000); }

    function methodIcon(method) {
        const m = (method || '').toLowerCase();
        if (m === 'zaad') return 'fa-mobile-alt';
        if (m === 'edahab') return 'fa-money-bill-wave';
        if (m === 'card' || m === 'cards') return 'fa-credit-card';
        return 'fa-hand-holding-usd';
    }
    function methodBadge(method) {
        const m = (method || '').toLowerCase();
        if (m === 'zaad') return 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300 border-purple-200 dark:border-purple-700';
        if (m === 'edahab') return 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 border-emerald-200 dark:border-emerald-700';
        if (m === 'card' || m === 'cards') return 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 border-blue-200 dark:border-blue-700';
        return 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 border-amber-200 dark:border-amber-700';
    }

    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validatePhone(phone) {
        return !phone || /^[\d\s\-\+\(\)]{7,20}$/.test(phone);
    }

    function curSym() { return CURRENCY_MAP[db.settings.currency] || '$'; }

    // Render student avatar (photo or initials)
    function renderAvatar(student, sizeClass, extraClass) {
        const size = sizeClass || 'w-9 h-9';
        const cls = extraClass || '';
        if (student && student.photo) {
            return `<div class="${size} rounded-full flex-shrink-0 overflow-hidden ${cls}"><img src="${escapeHtml(student.photo)}" alt="" class="w-full h-full object-cover"></div>`;
        }
        const name = student ? student.name : '?';
        const initials = escapeHtml(name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase());
        return `<div class="${size} rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-sm font-bold text-white shadow-sm flex-shrink-0 ${cls}">${initials}</div>`;
    }

    // Data cache to prevent XSS from JSON.stringify in inline onclick attributes
    let _dataCacheId = 0;
    const _dataCache = {};
    function cacheData(data) {
        const key = ++_dataCacheId;
        _dataCache[key] = data;
        return key;
    }
    function openCached(type, el) {
        const key = parseInt(el.dataset.cid);
        openModal(type, key ? _dataCache[key] : null, el.dataset.cb ? window[el.dataset.cb] : null);
    }

        const file = input.files[0];

            if (preview) preview.innerHTML = '<img src="' + escapeHtml(e.target.result) + '" class="w-full h-full object-cover">';
            window._studentPhotoData = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db2 = e.target.result;
                if (!db2.objectStoreNames.contains(STORE_NAME)) {
                    db2.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function loadDB() {
        try {
            const dbConn = await openDB();
            return new Promise((resolve, reject) => {
                const tx = dbConn.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const getReq = store.get('main');
                getReq.onsuccess = () => {
                    const data = getReq.result ? getReq.result.data : null;
                    dbConn.close();
                    if (data) {
                        if (!data.buses) data.buses = [];
                        if (!data.staff) data.staff = [];
                        if (!data.expenses) data.expenses = [];
                        if (!data.settings) data.settings = {};
                        if (!data.settings.shortName) data.settings.shortName = 'School';
                        if (!data.settings.schoolAddress) data.settings.schoolAddress = '';
                        if (!data.settings.schoolPhone) data.settings.schoolPhone = '';
                        if (!data.settings.schoolEmail) data.settings.schoolEmail = '';
                        if (!data.settings.schoolWebsite) data.settings.schoolWebsite = '';
                        if (!data.settings.currency) data.settings.currency = 'USD';
                        resolve(data);
                    } else {
                        resolve(null);
                    }
                };
                getReq.onerror = () => reject(getReq.error);
            });
        } catch (e) {
            console.error('IndexedDB error:', e);
            return null;
        }
    }

    async function saveDB() {
        try {
            const dbConn = await openDB();
            return new Promise((resolve, reject) => {
                const tx = dbConn.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id: 'main', data: JSON.parse(JSON.stringify(db)) });
                tx.oncomplete = () => { dbConn.close(); resolve(); };
                tx.onerror = () => { dbConn.close(); reject(tx.error); };
            });
        } catch (e) {
            console.error('IndexedDB save error:', e);
        }
    }

    let db = getInitialData();

    let _loadPromise = null;
    let _lastRefresh = null;

        const stored = await loadDB();
        if (stored) {
            Object.assign(db, stored);

        // Ensure admin credentials are always correct
        const adminUser = db.users.find(u => u.id === 1) || db.users[0];

    function updateClassStrength(classId) {
        const cls = db.classes.find(c => c.id === classId);
        if (cls) cls.currentStrength = db.students.filter(s => s.classId === classId).length;
        saveDB();
    }

    // ======================== API ========================
    const api = {
        login(email, pwd) {
            const user = db.users.find(u => u.email === email);
            if (!user) throw new Error('Invalid email or password');
            const salt = user.salt || db.settings._salt || '';
            const hash = CryptoJS.SHA256(salt + pwd).toString();
            if (hash !== user.password) throw new Error('Invalid email or password');
            const session = { id: user.id, role: user.role, name: user.name, email: user.email };
            localStorage.setItem('auth_session', JSON.stringify(session));
            return session;
        },
        logout() { localStorage.removeItem('auth_session'); },
        getSession() { return JSON.parse(localStorage.getItem('auth_session')); },

        getStudents() { return [...db.students]; },
        addStudent(data) {
            if (!data.name || !data.name.trim()) throw new Error('Student name is required');
            if (!data.rollNo || !data.rollNo.trim()) throw new Error('Roll number is required');
            if (db.students.some(s => s.rollNo === data.rollNo)) throw new Error('Roll number already exists');
            if (data.email && !validateEmail(data.email)) throw new Error('Invalid email format');
            if (data.phone && !validatePhone(data.phone)) throw new Error('Invalid phone format');

            const oldClass = db.students[idx].classId;

            saveDB();
            if (oldClass !== data.classId) { updateClassStrength(oldClass); updateClassStrength(data.classId); }

        deleteStudent(id) {

                db.students = db.students.filter(s => s.id !== id);

                db.results = db.results.filter(r => r.studentId !== id);

        promoteClass(classId, nextClassName, section) {

            if (studentsInClass.length === 0) throw new Error('No students to promote');
            const targetSection = section || 'A';
            const existingClass = db.classes.find(c => c.name === nextClassName && c.section === targetSection);
            let newClassId;
            if (existingClass) {
                newClassId = existingClass.id;
            } else {
                newClassId = genId();
                db.classes.push({ id: newClassId, name: nextClassName, section: targetSection, capacity: 40, currentStrength: 0, classTeacherId: null, academicYear: db.settings.academicYear, roomNo: 'New' });
            }
            studentsInClass.forEach(s => { s.classId = newClassId; });
            updateClassStrength(classId);
            updateClassStrength(newClassId);
            saveDB();

        getSubjects() { return [...db.subjects]; },

            if (!data.name || !data.name.trim()) throw new Error('Subject name is required');

            const newSubject = { ...data, id: genId(), name: data.name.trim() };

        updateSubject(id, data) {
            const idx = db.subjects.findIndex(s => s.id === id);

        },
        deleteSubject(id) {
            if (db.results.some(r => r.subjectId === id)) throw new Error('Cannot delete subject with existing results');
            db.subjects = db.subjects.filter(s => s.id !== id);
            saveDB();
        },
        getResults() { return [...db.results]; },
        addResult(data) {
            const exam = db.exams.find(e => e.id === data.examId);
            const student = db.students.find(s => s.id === data.studentId);
            const subject = db.subjects.find(sub => sub.id === data.subjectId);
            if (!exam || !student || !subject) throw new Error('Invalid data: check exam, student, and subject');
            if (student.classId !== exam.classId) throw new Error('Student is not enrolled in this exam\'s class');
            if (data.marksObtained > subject.maxMarks) throw new Error(`Maximum marks for ${subject.name} is ${subject.maxMarks}`);
            if (data.marksObtained < 0) throw new Error('Marks cannot be negative');
            const percentage = (data.marksObtained / subject.maxMarks) * 100;
            const grade = this.calculateGrade(percentage);
            const newResult = { ...data, id: genId(), grade, percentage };
            db.results.push(newResult);
            saveDB();
            return newResult;
        },
        calculateGrade(percent) {
            if (percent >= 90) return 'A+';
            if (percent >= 80) return 'A';
            if (percent >= 70) return 'B+';
            if (percent >= 60) return 'B';
            if (percent >= 50) return 'C';
            return 'D';
        },
        getFees() { return [...db.fees]; },
        addFee(data) {
            if (!data.studentId) throw new Error('Student is required');
            if (!data.breakdown || data.breakdown.length === 0) throw new Error('At least one fee item is required');
            const totalAmount = data.breakdown.reduce((s, b) => s + (b.amount || 0), 0);
            if (totalAmount <= 0) throw new Error('Total fee amount must be greater than 0');
            const newFee = { ...data, id: genId(), totalAmount, paidAmount: 0, status: 'pending', transactions: [] };
            db.fees.push(newFee);
            saveDB();
            return newFee;
        },
        addPayment(feeId, amount, method = 'cash') {
            const fee = db.fees.find(f => f.id === feeId);
            if (!fee) throw new Error('Fee record not found');
            fee.paidAmount += amount;
            const receiptNo = 'RCP-' + Date.now();
            fee.transactions.push({ id: genId(), amount, date: new Date().toISOString().slice(0,10), method, receiptNo });
            const totalAmt = fee.totalAmount || (fee.breakdown ? fee.breakdown.reduce((s,b) => s+(b.amount||0), 0) : 0);
            if (fee.paidAmount >= totalAmt) fee.status = 'paid';
            else if (fee.paidAmount > 0) fee.status = 'partial';
            if (new Date(fee.dueDate) < new Date() && fee.status !== 'paid') fee.status = 'overdue';
            saveDB();
            return fee.transactions[fee.transactions.length-1];
        },
        deleteFee(id) {
            db.fees = db.fees.filter(f => f.id !== id);
            saveDB();
        },
        getBuses() { return [...(db.buses || [])]; },

        getStats() {
            const totalAttendance = db.attendance.length;
            const present = db.attendance.filter(a => a.status === 'present').length;
            const attendanceRate = totalAttendance ? Math.round((present / totalAttendance) * 100) : 0;
            const totalFees = db.fees.reduce((sum, f) => sum + f.totalAmount, 0);
            const collectedFees = db.fees.reduce((sum, f) => sum + f.paidAmount, 0);
            return {
                students: db.students.length,
                teachers: db.teachers.length,
                classes: db.classes.length,
                attendanceRate,
                totalFees,
                collectedFees,
                pendingFees: totalFees - collectedFees
            };
        },
        exportToCSV(type) {
            let data, headers, filename;
            if (type === 'students') {
                data = db.students.map(s => ({ Name: s.name, RollNo: s.rollNo, Class: db.classes.find(c=>c.id===s.classId)?.name || '', Email: s.email || '', Parent: s.parentName || '' }));
                headers = ['Name','RollNo','Class','Email','Parent'];
                filename = 'students.csv';
            } else if (type === 'results') {
                data = db.results.map(r => ({ Student: db.students.find(s=>s.id===r.studentId)?.name || '', Exam: db.exams.find(e=>e.id===r.examId)?.name || '', Subject: db.subjects.find(sub=>sub.id===r.subjectId)?.name || '', Marks: r.marksObtained, Grade: r.grade }));
                headers = ['Student','Exam','Subject','Marks','Grade'];
                filename = 'results.csv';
            } else return;
            const csvRows = [headers.join(',')];
            for (const row of data) {
                const values = headers.map(header => JSON.stringify(String(row[header] || '')));
                csvRows.push(values.join(','));
            }
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        },
        addUser(data) {
            if (!data.name || !data.name.trim()) throw new Error('Name is required');
            if (!data.email || !data.email.trim()) throw new Error('Email is required');
            if (!data.password || !data.password.trim()) throw new Error('Password is required');
            if (db.users.find(u => u.email === data.email)) throw new Error('Email already exists');
            const salt = db.settings._salt || Math.random().toString(36).slice(2, 10);
            if (!db.settings._salt) db.settings._salt = salt;
            const newUser = {
                id: genId(),
                email: data.email.trim(),
                password: CryptoJS.SHA256(salt + data.password).toString(),
                salt: salt,
                role: data.role || 'teacher',
                name: data.name.trim(),
                avatar: data.name.trim().split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()
            };
            db.users.push(newUser);
            saveDB();
            return newUser;
        },
        updateUserEmail(id, email) {
            const user = db.users.find(u => u.id === id);
            if (!user) throw new Error('User not found');
            if (!email || !email.trim()) throw new Error('Email is required');
            const dup = db.users.find(u => u.email === email.trim() && u.id !== id);
            if (dup) throw new Error('Email already in use by another user');
            user.email = email.trim();
            saveDB();
        },
        deleteUser(id) {
            if (id === currentUser.id) throw new Error('Cannot delete your own account');
            db.users = db.users.filter(u => u.id !== id);
            saveDB();
        },
        updateProfile(id, data) {
            const user = db.users.find(u => u.id === id);
            if (!user) throw new Error('User not found');
            if (data.name) user.name = data.name.trim();
            if (data.email) user.email = data.email.trim();
            saveDB();
            const session = { id: user.id, role: user.role, name: user.name, email: user.email };
            localStorage.setItem('auth_session', JSON.stringify(session));
            currentUser = session;
        },
        exportData() {
            const dataStr = JSON.stringify({ version: '2.1', exportDate: new Date().toISOString(), data: db }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `edunexus_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        },
        importData(file, callback) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.data) { db = imported.data; saveDB(); callback(true, 'Data imported. Reloading...'); window.location.reload(); }
                    else throw new Error('Invalid file format');
                } catch (err) { callback(false, err.message); }
            };
            reader.readAsText(file);
        }
    };

    function updateStudentsForFee() {
        const classSelect = document.getElementById('fee_classId');
        const studentSelect = document.getElementById('fee_studentId');
        if (!classSelect || !studentSelect) return;
        const classId = parseInt(classSelect.value);
        if (!classId) {
            studentSelect.innerHTML = '<option value="">Select Class first</option>';
            studentSelect.disabled = true;
            return;

        const classStudents = api.getStudents().filter(s => s.classId === classId);

    // Debounce helper for search inputs (avoids polluting window)
    function debounceSearch(key, delay) {
        return function() {
            const val = this.value;
            clearTimeout(this._dbTimer);
            this._dbTimer = setTimeout(function() {
                filters[key] = val;
                if (key === 'studentSearch' || key === 'teacherSearch') pagination[key.replace('Search', 's')] = 1;
                render();
            }, delay || 100);
        };
    }

    function showNotification(msg, type = 'success') {
        if (notificationTimer) clearTimeout(notificationTimer);
        notification = { msg, type };
        render();
        notificationTimer = setTimeout(() => { notification = null; notificationTimer = null; render(); }, 3000);
    }
    function dismissNotification() {
        if (notification && notification.confirm) return;
        if (notificationTimer) clearTimeout(notificationTimer);
        notification = null; notificationTimer = null; render();
    }

                    api.updateTeacher(modal.data.id, form);

    function doPayment() {
        try {

            const method = document.getElementById('pay_method').value;
            if (!amount || amount <= 0) throw new Error('Enter a valid amount');

            closePaymentModal();
            showReceipt(transaction, student ? student.name : 'Unknown');
            showNotification('Payment recorded successfully');
            render();
        } catch (err) {

        safeConfirm(`Delete this ${type} permanently? This action cannot be undone.`, function(confirmed) {
            if (!confirmed) return;
            try {
                if (type === 'student') api.deleteStudent(id);
                else if (type === 'teacher') api.deleteTeacher(id);
                else if (type === 'class') api.deleteClass(id);
                else if (type === 'exam') api.deleteExam(id);
                else if (type === 'subject') api.deleteSubject(id);
                else if (type === 'fee') api.deleteFee(id);
                else if (type === 'bus') api.deleteBus(id);
                else if (type === 'staff') api.deleteStaff(id);
                else if (type === 'expense') api.deleteExpense(id);
                const label = type === 'subject' ? 'Subject' : type.charAt(0).toUpperCase() + type.slice(1);
                showNotification(`${label} deleted successfully`);
                render();
            } catch (err) { showNotification(err.message, 'error'); }

        const exam = db.exams.find(e => e.id === examId);

    function renderPagination(currentPage, totalItems, baseId) {
        const totalPages = Math.ceil(totalItems / PAGE_SIZE);
        if (totalPages <= 1) return '';
        let html = '<div class="flex items-center gap-1 mt-4">';
        html += `<button onclick="paginate('${baseId}', ${currentPage - 1})" class="pagination-btn px-3 py-1 rounded border ${currentPage <= 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<button onclick="paginate('${baseId}', ${i})" class="pagination-btn px-3 py-1 rounded border ${i === currentPage ? 'bg-indigo-600 text-white' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}">${i}</button>`;
        }
        html += `<button onclick="paginate('${baseId}', ${currentPage + 1})" class="pagination-btn px-3 py-1 rounded border ${currentPage >= totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>`;
        html += `<span class="text-sm text-gray-500 ml-2">${totalItems} total</span>`;
        html += '</div>';
        return html;
    }

                            <button onclick="_confirmCallback(true);notification=null;render()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm transition">Confirm</button>
                            <button onclick="notification=null;render()" class="flex-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 py-2 rounded-lg text-sm transition">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>` : `
            <div class="fixed bottom-5 right-5 z-50 toast-notification cursor-pointer" onclick="dismissNotification()">
                <div class="px-5 py-3 rounded-xl shadow-lg text-white text-sm flex items-center gap-2 ${notification.type === 'success' ? 'bg-green-600' : 'bg-red-600'}">
                    <i class="fas ${notification.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                    ${escapeHtml(notification.msg)}
                </div>
            </div>`) : '';

        const sidebarHtml = `
            <div class="fixed inset-y-0 left-0 z-40 w-72 xl:w-80 sidebar flex flex-col transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-all duration-300 ease-out shadow-2xl shadow-indigo-900/20 border-r border-indigo-500/10">
                <div class="sidebar-orb"></div>
                <div class="sidebar-orb"></div>
                <div class="sidebar-orb"></div>
                <div class="p-5 xl:p-6 flex-shrink-0 relative">
                    <div class="sidebar-header-shine"></div>
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-400 via-purple-500 to-pink-500 flex items-center justify-center text-base font-bold text-white flex-shrink-0 sidebar-logo-glow shadow-lg shadow-indigo-500/30">
                            ${escapeHtml((settings.shortName || 'S').slice(0, 2).toUpperCase())}
                        </div>
                        <div class="min-w-0">
                            <h1 class="font-bold text-base text-white truncate tracking-tight">${escapeHtml(settings.schoolName)}</h1>
                            <p class="text-[10px] text-indigo-300/60 truncate tracking-wider">${escapeHtml(settings.academicYear)}</p>
                        </div>
                    </div>
                </div>
                <nav class="sidebar-scroll flex-1 overflow-y-auto px-3 xl:px-4 pb-4 space-y-0.5 relative">
                    <div class="sidebar-user-card flex items-center gap-3 px-3 xl:px-4 py-2.5 mb-3 rounded-xl flex-shrink-0">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-400 via-purple-500 to-pink-500 flex items-center justify-center text-xs font-bold text-white flex-shrink-0 shadow-md shadow-indigo-500/20">
                            ${escapeHtml((currentUser.name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase())}
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold text-white truncate">${escapeHtml(currentUser.name)}</p>
                            <p class="text-[10px] text-indigo-300/70 capitalize font-medium flex items-center gap-1.5">
                                <span class="sidebar-badge-dot bg-emerald-400"></span>
                                <span>${escapeHtml(currentUser.role)}</span>
                            </p>
                        </div>
                        <div class="sidebar-badge-dot bg-emerald-400 flex-shrink-0"></div>
                    </div>
                    <div class="sidebar-section-label">Navigation</div>
                    ${navItems.map(item => `
                        <button onclick="setActiveTab('${item.id}')" class="sidebar-item w-full flex items-center gap-3 px-3 xl:px-4 py-2 rounded-xl text-sm font-medium ${activeTab === item.id ? 'active' : 'text-indigo-200/70 hover:text-white'}">
                            <div class="sidebar-item-icon">
                                <i class="fas fa-${item.icon} text-xs"></i>
                            </div>
                            <span>${item.label}</span>
                            ${activeTab === item.id ? '<i class="fas fa-chevron-right text-[9px] ml-auto text-indigo-300/50"></i>' : ''}
                        </button>`).join('')}
                    <div class="sidebar-divider"></div>
                    <div class="sidebar-section-label">System</div>
                    <button onclick="refreshData()" class="sidebar-item w-full flex items-center gap-3 px-3 xl:px-4 py-2 rounded-xl text-sm font-medium text-indigo-200/70 hover:text-white">
                        <div class="sidebar-item-icon"><i class="fas fa-sync-alt text-xs"></i></div>
                        <span>Refresh Data</span>
                    </button>
                    <div id="refresh-timestamp" class="text-[9px] text-indigo-400/30 text-center pt-1 ${_lastRefresh ? '' : 'hidden'}">${_lastRefresh ? 'Last sync: ' + _lastRefresh.toLocaleTimeString() : ''}</div>
                    <button onclick="logout()" class="sidebar-item w-full flex items-center gap-3 px-3 xl:px-4 py-2 rounded-xl text-sm font-medium text-red-400/70 hover:text-red-300">
                        <div class="sidebar-item-icon !bg-red-500/10 !border-red-500/10 !text-red-400/50 hover:!bg-red-500/20 hover:!text-red-300"><i class="fas fa-sign-out-alt text-xs"></i></div>
                        <span>Logout</span>
                    </button>
                </nav>
            </div>`;

        const mainHtml = `
            <div class="flex h-screen">
                <div class="flex-1 flex flex-col overflow-hidden lg:ml-72 xl:ml-80">
                    <div class="sticky top-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur border-b dark:border-gray-700 px-4 md:px-8 py-3 flex justify-between items-center z-30">
                        <button class="lg:hidden text-xl" onclick="toggleSidebar()">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="flex items-center gap-3">
                            <span class="hidden sm:inline text-sm text-gray-500 dark:text-gray-400">${escapeHtml(currentUser.name)}</span>
                            <span class="badge badge-info text-xs">${escapeHtml(currentUser.role)}</span>
                        </div>
                    </div>
                    <div class="flex-1 overflow-auto bg-gray-50 dark:bg-gray-900" id="app-scroll"><div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-8" id="app-content">
                            ${content}
                        </div></div>
                </div>
                ${sidebarHtml}
            </div>`;

        const newChromeKey = sidebarOpen + '|' + activeTab + '|' + currentUser.id + '|' + currentUser.name + '|' + currentUser.role + '|' + settings.schoolName + '|' + settings.shortName + '|' + settings.academicYear + '|' + settings.darkMode;
        if (_chromeKey !== newChromeKey) {
            _chromeKey = newChromeKey;
            document.getElementById('app').innerHTML = mainHtml + '<div id="app-modals">' + modalHtml + paymentHtml + receiptHtml + notificationHtml + '</div>';
        } else {
            document.getElementById('app-content').innerHTML = content;
            const m = document.getElementById('app-modals');
            if (m) m.innerHTML = modalHtml + paymentHtml + receiptHtml + notificationHtml;
        }
        setTimeout(function() {
            const inputIds = ['studentSearchInput','teacherSearchInput','examSearchInput','attnSearchInput','feeSearchInput','classStudentSearchInput'];
            const filterKeys = ['studentSearch','teacherSearch','examSearch','attendanceSearch','feeSearch','classStudentSearch'];
            for (let i = 0; i < inputIds.length; i++) {
                const inp = document.getElementById(inputIds[i]);
                if (inp) {
                    inp.value = filters[filterKeys[i]] || '';
                }
            }
            if (_rafActiveId && inputIds.indexOf(_rafActiveId) !== -1) {
                const el = document.getElementById(_rafActiveId);
                if (el) {
                    el.focus();
                    const len = el.value.length;
                    el.setSelectionRange(len, len);
                }
            }
        }, 0);
    }

    window.setActiveTab = (tab) => { activeTab = tab; selectedClassId = null; reportType = ''; selectedStudentId = null; sidebarOpen = false; render(); };
    window.toggleSidebar = () => { sidebarOpen = !sidebarOpen; render(); };
    window.createUser = () => {
        try {
            const name = document.getElementById('new_user_name').value;
            const email = document.getElementById('new_user_email').value;
            const password = document.getElementById('new_user_password').value;
            const role = document.getElementById('new_user_role').value;
            api.addUser({ name, email, password, role });
            document.getElementById('new_user_name').value = '';
            document.getElementById('new_user_email').value = '';
            document.getElementById('new_user_password').value = '';
            showNotification('User created successfully');
            render();
        } catch (err) { showNotification(err.message, 'error'); }
    };
    window.logout = () => { api.logout(); currentUser = null; _chromeKey = null; render(); };
    window.refreshData = () => {
        if (document.getElementById('refresh-overlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'refresh-overlay';
        overlay.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50';
        overlay.innerHTML = '<div class="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-2xl text-center max-w-sm mx-4">' +
            '<div class="w-14 h-14 rounded-full bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center mx-auto mb-4">' +
            '<i class="fas fa-sync-alt text-indigo-600 dark:text-indigo-400 text-2xl animate-spin"></i></div>' +
            '<h3 class="text-lg font-bold dark:text-white mb-1">Refreshing Data</h3>' +
            '<p class="text-sm text-gray-500">Reloading from IndexedDB...</p></div>';
        document.body.appendChild(overlay);
        setTimeout(async () => {
            try {
                const fresh = await loadDB();
                if (fresh) {
                    Object.assign(db, fresh);
                    db.classes.forEach(c => { c.currentStrength = db.students.filter(s => s.classId === c.id).length; });
                    _lastRefresh = new Date();
                    const timeStr = _lastRefresh.toLocaleTimeString();
                    const el = document.getElementById('refresh-timestamp');
                    if (el) el.textContent = 'Last: ' + timeStr;
                    showNotification('Data refreshed at ' + timeStr + ' · ' + db.students.length + ' students, ' + db.fees.length + ' fees');
                } else {
                    showNotification('No data in IndexedDB to refresh', 'warning');
                }
            } catch (err) {
                showNotification('Refresh failed: ' + err.message, 'error');
            } finally {
                const el = document.getElementById('refresh-overlay');
                if (el) el.remove();
                render();
            }
        }, 400);
    };
    window.saveUserEmail = (id) => {
        try {
            const email = document.getElementById('user-email-' + id).value;
            api.updateUserEmail(id, email);
            showNotification('Email updated successfully');
            render();
        } catch (err) { showNotification(err.message, 'error'); }
    };
    window.deleteUser = (id) => {
        safeConfirm('Delete this user permanently?', function(confirmed) {
            if (!confirmed) return;
            try {
                api.deleteUser(id);
                showNotification('User deleted');
                render();
            } catch (err) { showNotification(err.message, 'error'); }
        });
    };
    window.resetSystem = () => {
        safeConfirm('Reset all data permanently? This cannot be undone.', function(confirmed) {
            if (!confirmed) return;
            safeConfirm('Are you absolutely sure? All students, teachers, fees, and other records will be deleted.', function(confirmed2) {
                if (!confirmed2) return;
                db = getInitialData();
                saveDB().then(() => {
                    localStorage.removeItem('auth_session');
                    currentUser = null;
                    _chromeKey = null;
                    showNotification('System has been reset', 'success');
                    render();
                });
            });
        });
    };
    window.openModal = openModal; window.closeModal = closeModal; window.saveModal = saveModal;
    window.openCached = openCached; window.cacheData = cacheData; window.dismissNotification = dismissNotification; window.previewStudentPhoto = previewStudentPhoto;
    function deleteFee(id) { deleteEntity('fee', id); }
    function deleteBus(id) { deleteEntity('bus', id); }
    window.deleteEntity = deleteEntity; window.markAttendance = markAttendance; window.payFee = payFee; window.deleteFee = deleteFee; window.deleteBus = deleteBus;
    window.saveSettings = saveSettings; window.saveProfile = saveProfile; window.handleImport = handleImport; window.api = api;
    window.showReceipt = showReceipt; window.showReceiptFromFee = showReceiptFromFee; window.closeReceipt = closeReceipt; window.printReceipt = printReceipt;
    window.filters = filters; window.paginate = (baseId, page) => { pagination[baseId] = page; render(); };
    window.updateSubjectsForExam = updateSubjectsForExam; window.updateStudentsForExam = updateStudentsForExam; window.updateStudentsForFee = updateStudentsForFee; window.openPaymentModal = openPaymentModal;
    window.closePaymentModal = closePaymentModal; window.doPayment = doPayment;

    initDatabase();
</script>
</body>
</html>
